apiVersion: v1
kind: Service
metadata:
  name: my-nlb
  labels:
    app: mynlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external" #must have AWS loadbalancer controller installed
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-name: my-nlb

    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: '3'
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: '3'

    service.beta.kubernetes.io/load-balancer-source-ranges: 0.0.0.0/0
    service.beta.kubernetes.io/aws-load-balancer-scheme: 'internet-facing'
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert:
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: 443
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-3-2021-06
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp

spec:
  selector:
    app: myapp1
  ports:
    - port: 80
      targetPort: 80
    - port: 443
      targetPort: 80
  type: LoadBalancer
  