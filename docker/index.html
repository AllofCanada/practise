<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKS Demo - allofcanada.ca</title>
    
    <!-- Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Internal CSS */
        body, html {
            height: 100%;
            background-color: #121212; 
            color: #ffffff;
        }
        
        .navbar {
            border-bottom: 1px solid #333;
        }

        .flex-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        .demo-container {
            /* Vertical centering using margin auto on the child element */
            margin: auto;
            text-align: center;
            padding: 3rem;
            background-color: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 600px;
            width: 100%;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #198754;
            color: white;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">allofcanada.ca Node</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('home')}}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('services')}}">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('about')}}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('contact')}}">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container flex-wrapper">
        <div class="demo-container">
            <h1 class="mb-3">AWS EKS Cluster</h1>
            <p class="text-muted mb-4">Traffic is successfully routing to this container pod.</p>
            
            <div class="mb-4">
                {{ img('dummy.png') }}
            </div>
            
            <div class="status-badge">
                Status: Healthy
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
